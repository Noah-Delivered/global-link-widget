var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var won = function(n){ return "₩" + Number(n).toLocaleString("ko-KR"); };
var byId = function(id){ return PRODUCTS.filter(function(p){return p.id===id;})[0]; };

function setHead(p){
  var canon = document.querySelector('link[rel="canonical"]');
  var ogt = document.querySelector('meta[property="og:type"]');
  if(!ogt){ ogt = document.createElement('meta'); ogt.setAttribute('property','og:type'); document.head.appendChild(ogt); }
  var ld = document.getElementById('gl-ld');
  if(ld) ld.remove();

  if(p){
    document.title = p.name + " · " + (window.__MALL_NAME__ || "뷰티라운지");
    canon.href = p.origin;
    ogt.setAttribute('content','product');
    var s = document.createElement('script');
    s.type = 'application/ld+json'; s.id = 'gl-ld';
    s.textContent = JSON.stringify({
      "@context":"https://schema.org","@type":"Product",
      name:p.name, sku:p.id, image:[p.image], url:p.origin,
      brand:{"@type":"Brand", name:p.brand},
      offers:{"@type":"Offer", price:p.price, priceCurrency:"KRW",
              availability:"https://schema.org/InStock", url:p.origin}
    });
    document.head.appendChild(s);
  } else {
    document.title = (window.__MALL_NAME__ || "뷰티라운지") + " · " + (document.querySelector(".logo em") ? document.querySelector(".logo em").textContent : "BEAUTY LOUNGE");
    canon.href = location.origin + location.pathname;
    ogt.setAttribute('content','website');
  }
}

function cardHtml(p, rank){
  return '<a class="card" href="#/p/' + p.id + '">' +
    '<div class="th"><img src="' + p.image + '" alt="" loading="lazy">' +
      (rank ? '<span class="rk">' + rank + '</span>' : '') + '</div>' +
    '<div class="bd">' + esc(p.brand) + '</div>' +
    '<div class="nm">' + esc(p.name) + '</div>' +
    '<div class="pc">' +
      (p.rate ? '<span class="dc">' + p.rate + '%</span>' : '') +
      '<span class="np">' + won(p.price) + '</span>' +
      (p.orig ? '<span class="op">' + won(p.orig) + '</span>' : '') +
    '</div></a>';
}

function renderList(){
  setHead(null);
  document.getElementById('app').innerHTML =
    '<section class="hero">' +
      '<span class="lb">WEEKLY PICK</span>' +
      '<h1>오늘의 뷰티,<br>라운지에서 만나보세요.</h1>' +
      '<p>매주 새로운 브랜드와 단독 특가를 소개합니다.</p>' +
      '<span class="cta">기획전 보러가기 →</span>' +
    '</section>' +
    '<div class="sh"><h2>베스트 상품</h2><span class="cnt">' + PRODUCTS.length + '개</span></div>' +
    '<div class="grid">' + PRODUCTS.map(function(p,i){ return cardHtml(p, i<3 ? i+1 : 0); }).join('') + '</div>';
  window.scrollTo(0,0);
}

function renderPdp(id){
  var p = byId(id);
  if(!p){ location.hash = '#/'; return; }
  setHead(p);
  document.getElementById('app').innerHTML =
    '<div class="crumb"><a href="#/">홈</a> › ' + esc(p.cat) + ' › ' + esc(p.brand) + '</div>' +
    '<div class="pdp product-detail" data-gl-product>' +
      '<div class="gal product-detail__gallery" data-gl-image>' +
        '<img src="' + p.image + '" alt="' + esc(p.name) + '"></div>' +
      '<div>' +
        '<div class="pd-brand">' + esc(p.brand) + '</div>' +
        '<h1 class="pd-name product-detail__name" data-gl-name>' + esc(p.name) + '</h1>' +
        '<div class="pd-price product-detail__price">' +
          (p.rate ? '<span class="rate">' + p.rate + '%</span>' : '') +
          '<span class="now" data-gl-price>' + won(p.price) + '</span>' +
          (p.orig ? '<span class="was">' + won(p.orig) + '</span>' : '') +
        '</div>' +
        (p.soldOut ? '<div class="is-soldout">품절된 상품입니다</div>' : '') +
        '<div class="pd-opts product-detail__options" data-gl-options>' +
          p.options.map(function(o){
            var plain = o.name.replace(/\s*\(선택사항\)/, '');
            return '<label>' + (o.required ? '<span class="req">*</span> ' : '') + esc(o.name) + '</label>' +
              '<div class="selw"><select data-gl-option-name="' + esc(o.name) + '">' +
              '<option value="">' + esc(plain) + '을(를) 선택해 주세요</option>' +
              o.values.map(function(v){
                // 문자열이면 그대로, 객체면 가맹점 고유 class 를 그대로 얹는다
                var txt = (typeof v === 'string') ? v : v.v;
                var cls = (typeof v === 'string') ? '' : (v.cls || '');
                return '<option value="' + esc(txt) + '"' + (cls ? ' class="' + esc(cls) + '"' : '') +
                       '>' + esc(txt) + '</option>';
              }).join('') +
            '</select></div>';
          }).join('') +
          (p.maxQty
            ? '<label>수량</label><div class="qtyrow">' +
              '<input type="number" name="quantity" value="1" min="1" max="' + p.maxQty + '">' +
              '<span class="qtynote">1인당 최대 ' + p.maxQty + '개 구매 가능</span></div>'
            : '') +
        '</div>' +
        '<div class="pd-meta">' +
          '<div><b>배송</b><span>택배배송 · 3만원 이상 무료배송</span></div>' +
          '<div><b>적립</b><span>구매 금액의 1% 적립</span></div>' +
          '<div><b>교환·반품</b><span>수령 후 7일 이내 신청 가능</span></div>' +
        '</div>' +
        '<div class="pd-btns">' +
          '<button class="btn-cart" data-gl-native-cart' + (p.soldOut ? ' disabled' : '') + '>장바구니</button>' +
          '<button class="btn-buy" data-gl-native-buy' + (p.soldOut ? ' disabled' : '') + '>' +
            (p.soldOut ? '품절' : '바로구매') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="desc"><h3>상품 상세정보</h3>' +
      '<p>' + esc(p.brand) + '의 ' + esc(p.name) + ' 입니다. 자세한 성분과 사용법은 상품 상세 이미지를 참고해 주세요.</p>' +
      '<p>본 상품은 제조사 정품 인증을 받은 상품만 취급합니다.</p></div>';

  document.querySelectorAll('.btn-cart, .btn-buy').forEach(function(b){
    b.addEventListener('click', function(){ alert('준비 중입니다.'); });
  });
  window.scrollTo(0,0);
}

function route(){
  var m = (location.hash || '#/').match(/^#\/p\/(\w+)/);
  if(m) renderPdp(m[1]); else renderList();
}
window.addEventListener('hashchange', route);
route();
</script>
